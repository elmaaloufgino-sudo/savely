name: Refresh public deal pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-deal-pages.yml"
      - "scripts/generate-deal-pages.mjs"
      - "app.html"
  schedule:
    # Refresh twice per hour, away from the top of the hour.
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-public-deal-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate offer pages and sitemap
        run: node scripts/generate-deal-pages.mjs
      - name: Commit changed pages
        run: |
          if [ -z "$(git status --porcelain -- fynd sitemap.xml)" ]; then
            echo "No generated pages changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fynd sitemap.xml
          git commit -m "chore: refresh public offer pages and sitemap"
          git push origin main
