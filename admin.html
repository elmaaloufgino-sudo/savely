<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fyndaren admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--head:#1e293b;--green:#10b981;--gink:#059669;--line:#e2e8f0;--red:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--ink:#e8eef7;--mute:#94a3b8;--head:#111a2e;--gink:#34d399;--line:#263349;--red:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:16px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mark{width:42px;height:42px;border-radius:12px;background:#34d399;display:grid;place-items:center;font-size:22px}
h1{margin:0;font-size:20px}h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
h2{font-size:17px;margin:22px 0 10px}
.sp{flex:1}
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;margin-top:4px}
input[type=color]{padding:4px;height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:46px;border:0;border-radius:12px;background:var(--green);color:#fff;font-family:inherit;font-weight:700;font-size:16px;padding:0 18px;cursor:pointer;margin-top:16px;width:100%}
.btn.ghost{background:none;color:var(--gink);border:1px solid var(--line)}
.btn.sm{height:38px;font-size:14px;margin:0;width:auto;padding:0 14px}
.btn.red{background:none;color:var(--red);border:1px solid var(--red)}
.msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--red)}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.dot{width:40px;height:40px;border-radius:12px;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.t{flex:1;min-width:0}.t b{display:block;font-size:15px;overflow-wrap:anywhere}.t span{font-size:13px;color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:14px;padding:11px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.toast.show{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #34d399;outline-offset:2px}
.mark{width:46px;height:46px;border-radius:0;background:none;object-fit:contain;filter:drop-shadow(0 0 8px rgba(212,175,55,.45))}

.import-help{font-size:13px;color:var(--mute);line-height:1.5;margin:8px 0 12px}.import-row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.import-row input[type=checkbox]{width:20px;height:20px;flex:none;margin:2px 0}.import-row img{width:58px;height:58px;object-fit:contain;border-radius:9px;background:#fff;flex:none}.import-row .t{min-width:0}.import-row small{display:block;color:var(--mute);overflow-wrap:anywhere}.import-row .bad{color:var(--red)}.filepick{display:block;border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--bg)}.filepick input{height:auto;padding:8px 0;border:0;background:transparent}

.price-checks{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.price-checks-title{font-size:14px;font-weight:800;color:var(--ink);line-height:1.4}
.price-checks label{display:flex;align-items:flex-start;gap:10px;margin-top:12px;color:var(--ink);font-size:13px;line-height:1.45}
.price-checks input[type=checkbox]{width:20px;height:20px;min-width:20px;flex:0 0 20px;margin:0;padding:0;accent-color:var(--green)}
.image-preview{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:13px;color:var(--mute)}
.image-preview[hidden]{display:none}
.image-preview img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.image-preview .bad,.image-status.bad{color:var(--red)}
.image-placeholder{width:58px;height:58px;border:1px dashed var(--line);border-radius:9px;display:grid;place-items:center;color:var(--mute);font-size:11px;text-align:center;flex:none}
.import-row .image-status{display:block;font-size:11px;color:var(--mute)}
.import-row .import-issue{display:block}
</style>
</head>
<body>
<header><img class="mark" src="icon-192.png" alt="" width="46" height="46"><h1>Fyndaren admin<small id="who"></small></h1><div class="sp"></div><button class="btn ghost sm" id="out" hidden>Logga ut</button></header>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://ebmqzrejrpijitxeggsl.supabase.co';
const SUPABASE_KEY='sb_publishable_ep-vKQBf3tjvDC2h03BlYQ_hwUqrvY5';
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
let user=null,isAdmin=false,DATA=[],CODES=[],view='deals',editId=null,filter='',IMPORT_ROWS=[],IMPORT_CHECKED_ON='',IMPORT_CHECKS={campaign:false,reference:false,terms:false};
const $=s=>document.querySelector(s);
const todayISO=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colr=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#64748b';
const num=s=>{const n=parseFloat(String(s).replace(',','.'));return isNaN(n)?null:n};
const httpsUrl=s=>{try{const u=new URL(String(s||''));return u.protocol==='https:'&&!u.username&&!u.password?u.href:''}catch(e){return ''}};
const kr=n=>Number(n).toLocaleString('sv-SE',{maximumFractionDigits:2})+' kr';
const v=id=>$('#'+id).value;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
const setMsg=m=>{const e=$('#msg');if(e)e.textContent=m};

function loginView(note){
  $('#app').innerHTML=`<div class="panel"><b>Logga in för att hantera erbjudanden</b><label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Lösenord</label><input id="pw" type="password" autocomplete="current-password"><div class="msg" id="msg" role="alert">${esc(note||'')}</div><button class="btn" data-login>Logga in</button></div>`;
}
function denyView(){
  $('#app').innerHTML=`<div class="panel"><b>Ingen åtkomst</b><p>Du är inloggad som ${esc(user.email)}, men kontot saknar administratörsbehörighet. Lägg till kontot som administratör och ladda sedan om sidan.</p></div>`;
}
function priceChecksHTML(prefix){
  const isImport=prefix==='i';
  const checked=key=>isImport&&IMPORT_CHECKS[key]?'checked':'';
  const data=key=>isImport?` data-import-check="${key}"`:'';
  const heading=isImport?'Bekräfta kontrollerna för samtliga markerade produkter':'Obligatoriska kontroller före sparande';
  return `<div class="price-checks" role="group" aria-label="${heading}">
    <div class="price-checks-title">${heading}</div>
    <label><input id="${prefix}_check_campaign" type="checkbox"${checked('campaign')}${data('campaign')}>Jag har kontrollerat att kampanjpriset stämmer med butikens aktuella erbjudande.</label>
    <label><input id="${prefix}_check_reference" type="checkbox"${checked('reference')}${data('reference')}>Jag har verifierat jämförelsepriset mot butikens lägsta pris under de 30 dagarna före prissänkningen – inte ett rekommenderat pris.</label>
    <label><input id="${prefix}_check_terms" type="checkbox"${checked('terms')}${data('terms')}>Jag har kontrollerat giltighetstid, medlemskrav, mängdkrav och andra begränsningar.</label>
  </div>`;
}
function formHTML(d){
  d=d||{};
  const currentKategori=d.category==='Mat'?'Mat & Dryck':(d.category||'');
  const categoryChoices=['Mat & Dryck','Elektronik','Apotek','Kläder','Bygg & Hemmafix','Skönhet & Personlig vård','Hem & Inredning'];
  if(currentKategori&&!categoryChoices.includes(currentKategori))categoryChoices.push(currentKategori);
  const cats=categoryChoices.map(c=>`<option value="${esc(c)}" ${currentKategori===c||(!currentKategori&&c==='Mat & Dryck')?'selected':''}>${esc(c)}</option>`).join('');
  return `<div class="panel"><b id="ft">${editId?'Redigera erbjudande':'Lägg till erbjudande'}</b>
  <div class="two"><div><label for="f_store">Butik</label><input id="f_store" value="${esc(d.store)}" placeholder="ICA"></div><div><label for="f_cat">Kategori</label><select id="f_cat">${cats}</select></div></div>
  <label for="f_name">Produkt</label><input id="f_name" value="${esc(d.name)}" placeholder="Kycklingfilé 900 g">
  <label for="f_img">Produktbild (obligatorisk, direkt HTTPS-bildlänk)</label><input id="f_img" type="url" value="${esc(d.image_url)}" placeholder="https://…">
  <div class="image-preview" id="f_img_preview" hidden><img id="f_img_preview_img" alt="Förhandsvisning av produktbild"><span id="f_img_preview_status">Kontrollerar bild…</span></div>
  <p class="import-help">Bilden måste kunna laddas och visa rätt produkt. Använd en direktlänk till själva produktbilden.</p>
  <div class="two"><div><label for="f_price">Kampanjpris (kr)</label><input id="f_price" inputmode="decimal" value="${esc(d.price)}"></div><div><label for="f_old">Tidigare lägsta pris (30 dagar, kr)</label><input id="f_old" inputmode="decimal" value="${esc(d.old_price)}"></div></div>
  <p class="import-help">Vid prissänkningar ska jämförelsepriset vara butikens lägsta pris under de 30 dagarna före prissänkningen – inte ett rekommenderat pris. Kontrollera butikens prisunderlag innan du publicerar. Se <a href="https://www.konsumentverket.se/marknadsratt-foretag/prissankningar-regler-for-foretag/" target="_blank" rel="noopener noreferrer">Konsumentverkets vägledning</a>.</p>
  ${priceChecksHTML('f')}
  <div class="two"><div><label for="f_until">Giltighetstext</label><input id="f_until" value="${esc(d.valid_until)}" placeholder="söndag eller 30/10"></div><div><label for="f_mem">Medlemskap (valfritt)</label><input id="f_mem" value="${esc(d.membership)}" placeholder="ICA Stammis"></div></div>
  <div class="two"><div><label for="f_utext">Jämförpristext (valfritt)</label><input id="f_utext" value="${esc(d.unit_text)}" placeholder="87,78 kr/kg"></div><div><label for="f_uprice">Jämförpris (tal)</label><input id="f_uprice" inputmode="decimal" value="${esc(d.unit_price)}" placeholder="87.78"></div></div>
  <label for="f_group">Jämförelsegrupp (valfritt, samma namn jämförs tillsammans)</label><input id="f_group" value="${esc(d.compare_group)}" placeholder="Kyckling">
  <label for="f_aff">Butikslänk (valfri affiliatelänk, måste börja med https://)</label><input id="f_aff" type="url" value="${esc(d.affiliate_url)}" placeholder="https://…">
  <label for="f_url">Butik offer page (optional, a normal link, must start with https://)</label><input id="f_url" type="url" value="${esc(d.shop_url)}" placeholder="https://…">
  <div class="two"><div><label for="f_vt">Gäller t.o.m. (obligatoriskt datum; erbjudandet döljs efter denna dag)</label><input id="f_vt" type="date" value="${esc(d.valid_to)}"></div><div><label for="f_chk">Senast kontrollerad (datum)</label><input id="f_chk" type="date" max="${todayISO()}" value="${esc(d.checked_on)}"></div></div>
  <button class="btn ghost sm" type="button" data-today style="margin-top:8px">Sätt kontrolldatum till idag</button>
  <label for="f_cond">Villkor (valfritt, exempelvis köp 2 online)</label><input id="f_cond" value="${esc(d.conditions)}">
  <div class="two"><div><label for="f_logo">Butiksförkortning (valfritt)</label><input id="f_logo" maxlength="4" value="${esc(d.logo)}"></div><div><label for="f_color">Butiksfärg</label><input id="f_color" type="color" value="${colr(d.color)==='#64748b'&&!d.color?'#10b981':colr(d.color)}"></div></div>
  <div class="msg" id="msg" role="alert"></div>
  <button class="btn" data-save>${editId?'Spara ändringar':'Lägg till erbjudande'}</button>
  ${editId?'<button class="btn ghost" data-cancel>Avbryt</button>':''}</div>`;
}
function adminView(){
  if(view==='codes'){codesView();return}if(view==='import'){importView();return}
  $('#app').innerHTML=tabsHTML()+formHTML(editId?DATA.find(x=>x.id===editId):null)+`<h2>Alla erbjudanden (<span id="count">0</span>)</h2><input id="flt" type="search" placeholder="Sök erbjudanden…" aria-label="Search deals" value="${esc(filter)}"><div id="list" style="margin-top:10px"></div>`;
  renderList();updateManualImagePreview();
}
function renderList(){
  const t=filter.trim().toLowerCase();
  const items=DATA.filter(d=>!t||(d.store+' '+d.name+' '+d.category).toLowerCase().includes(t));
  $('#count').textContent=items.length;
  $('#list').innerHTML=items.length?items.map(d=>`<div class="item"><div class="dot" style="background:${colr(d.color)}">${esc(d.logo)}</div><div class="t"><b>${esc(d.store)}: ${esc(d.name)}</b><span>${kr(d.price)} (tidigare ${kr(d.old_price)}) · gäller t.o.m. ${esc(d.valid_until)}${d.affiliate_url?' · har affiliatelänk':''}${d.shop_url?' · har butikslänk':''}${d.valid_to&&d.valid_to<todayISO()?' · UTGÅNGET (dolt i appen)':''}</span></div><div class="acts"><button class="btn ghost sm" data-edit="${d.id}">Edit</button><button class="btn red sm" data-del="${d.id}">Delete</button></div></div>`).join(''):'<p>Inga erbjudanden hittades.</p>';
}
async function loadErbjudanden(){
  const {data,error}=await sb.from('deals').select('*').order('id',{ascending:false});
  if(error){toast('Kunde inte hämta erbjudandena');return}
  DATA=data;
  const cr=await sb.from('codes').select('*').order('id',{ascending:false});
  if(!cr.error)CODES=cr.data;
}
function tabsHTML(){
  return `<div class="two" style="margin-bottom:14px"><button class="btn ${view==='deals'?'':'ghost'} sm" style="width:100%" data-view="deals">Erbjudanden</button><button class="btn ${view==='codes'?'':'ghost'} sm" style="width:100%" data-view="codes">Rabattkoder</button><button class="btn ${view==='import'?'':'ghost'} sm" style="width:100%;grid-column:1/-1" data-view="import">Importera produkter</button></div>`;
}
function codesView(){
  $('#app').innerHTML=tabsHTML()+`<div class="panel"><b>Lägg till rabattkod</b>
  <div class="two"><div><label for="c_store">Butik</label><input id="c_store" placeholder="Zalando"></div><div><label for="c_code">Code</label><input id="c_code" placeholder="HOST15" autocapitalize="characters"></div></div>
  <label for="c_desc">Vad ger rabattkoden?</label><input id="c_desc" placeholder="15 % på höstnyheter">
  <div class="two"><div><label for="c_until">Giltighetstext (valfritt)</label><input id="c_until" placeholder="31/10"></div><div><label for="c_color">Butiksfärg</label><input id="c_color" type="color" value="#10b981"></div></div>
  <label for="c_aff">Shop link (optional, must start with https://)</label><input id="c_aff" type="url" placeholder="https://…">
  <div class="msg" id="msg" role="alert"></div><button class="btn" data-csave>Lägg till kod</button></div>
  <h2>Alla rabattkoder (${CODES.length})</h2>`+(CODES.length?CODES.map(c=>`<div class="item"><div class="dot" style="background:${colr(c.color)}">${esc(c.logo||String(c.store).slice(0,2))}</div><div class="t"><b>${esc(c.store)}: ${esc(c.code)}</b><span>${esc(c.description)}${c.valid_until?' · gäller t.o.m. '+esc(c.valid_until):''}</span></div><div class="acts"><button class="btn red sm" data-cdel="${c.id}">Delete</button></div></div>`).join(''):'<p>Inga rabattkoder ännu.</p>');
}
async function saveCode(){
  const store=v('c_store').trim(),code=v('c_code').trim().toUpperCase(),desc=v('c_desc').trim();
  if(!store||!code||!desc)return setMsg('Butik, rabattkod och beskrivning måste fyllas i.');
  const aff=v('c_aff').trim();
  if(aff&&!/^https:\/\/\S+$/i.test(aff))return setMsg('The shop link must start with https://');
  const w=store.split(/\s+/);
  const logo=w.length>1?w.map(x=>x[0]).join('').slice(0,3).toUpperCase():store.slice(0,3);
  setMsg('Sparar…');
  const res=await sb.from('codes').insert({store,logo,color:v('c_color'),code,description:desc,valid_until:v('c_until').trim()||null,affiliate_url:aff||null}).select();
  if(res.error||!res.data||!res.data.length)return setMsg('Kunde inte spara. Är du administratör och är rabattkodstabellen korrekt konfigurerad?');
  toast('Rabattkod tillagd');await loadErbjudanden();codesView();
}
async function delCode(id){
  const c=CODES.find(x=>x.id===id);if(!c)return;
  if(!confirm('Ta bort rabattkoden '+c.code+' för '+c.store+'?'))return;
  const res=await sb.from('codes').delete().eq('id',id).select();
  if(res.error||!res.data||!res.data.length)return toast('Kunde inte ta bort');
  toast('Rabattkod borttagen');await loadErbjudanden();codesView();
}
async function afterAuth(){
  $('#out').hidden=!user;$('#who').textContent=user?user.email:'';
  if(!user){isAdmin=false;loginView();return}
  const {data,error}=await sb.from('admins').select('user_id').eq('user_id',user.id);
  isAdmin=!error&&!!data&&data.length>0;
  if(!isAdmin){denyView();return}
  await loadErbjudanden();adminView();
}
async function doLogin(){
  if(!sb)return setMsg('Kunde inte starta. Ladda om sidan.');
  const email=v('em').trim(),pw=v('pw');
  if(!email||!pw)return setMsg('Ange e-postadress och lösenord.');
  setMsg('Vänta…');
  const {error}=await sb.auth.signInWithLösenord({email,password:pw});
  if(error)setMsg(error.message.includes('Invalid login')?'Fel e-postadress eller lösenord.':error.message);
}
function updateManualImagePreview(){
  const input=$('#f_img'),wrap=$('#f_img_preview'),img=$('#f_img_preview_img'),status=$('#f_img_preview_status');
  if(!input||!wrap||!img||!status)return;
  const raw=input.value.trim(),url=httpsUrl(raw);
  if(!raw){wrap.hidden=true;img.removeAttribute('src');delete img.dataset.src;status.textContent='';status.classList.remove('bad');return}
  wrap.hidden=false;
  if(!url){img.removeAttribute('src');delete img.dataset.src;status.textContent='Använd en giltig HTTPS-bildlänk.';status.classList.add('bad');return}
  if(img.dataset.src===url)return;
  status.textContent='Kontrollerar att bilden kan laddas…';status.classList.remove('bad');
  img.dataset.src=url;
  img.onload=()=>{if(img.dataset.src===url){status.textContent='Bilden kunde laddas. Kontrollera att det är rätt produkt.';status.classList.remove('bad')}};
  img.onerror=()=>{if(img.dataset.src===url){status.textContent='Bilden kunde inte laddas. Kontrollera länken.';status.classList.add('bad')}};
  img.src=url;
}
function collect(){
  const store=v('f_store').trim(),name=v('f_name').trim();
  let until=v('f_until').trim();const vt=v('f_vt');
  if(!until&&vt)until=(+vt.slice(8,10))+'/'+(+vt.slice(5,7));
  const price=num(v('f_price')),old=num(v('f_old')),image=httpsUrl(v('f_img').trim());
  if(!store||!name||!until)return {err:'Butik, product and valid gäller t.o.m. are required.'};
  if(!vt)return {err:'Ange ett riktigt slutdatum för erbjudandet.'};
  if(!editId&&vt<todayISO())return {err:'Ett nytt erbjudande kan inte publiceras med ett slutdatum som redan passerat.'};
  if(!image)return {err:'Lägg till en giltig HTTPS-länk till produktbilden.'};
  const preview=$('#f_img_preview_img');
  if(!preview||preview.dataset.src!==image||!preview.complete||preview.naturalWidth===0)return {err:'Kontrollera att produktbilden kan laddas i förhandsvisningen.'};
  if(!price||price<=0||!old)return {err:'Ange kampanjpris och jämförelsepris.'};
  if(old<=price)return {err:'Jämförelsepriset måste vara högre än kampanjpriset.'};
  if(!$('#f_check_campaign').checked||!$('#f_check_reference').checked||!$('#f_check_terms').checked)return {err:'Bekräfta alla tre pris- och villkorskontrollerna innan du sparar.'};
  const w=store.split(/\s+/);
  const logo=v('f_logo').trim()||(w.length>1?w.map(x=>x[0]).join('').slice(0,3).toUpperCase():store.slice(0,3));
  const aff=v('f_aff').trim();
  if(aff&&!/^https:\/\/\S+$/i.test(aff))return {err:'The shop link must start with https:// (use the link från your affiliate network).'};
  const url=v('f_url').trim();
  if(url&&!/^https:\/\/\S+$/i.test(url))return {err:'Erbjudandelänken måste börja med https://'};
  const cond=v('f_cond').trim(),chk=v('f_chk');
  if(!aff&&!url)return {err:'Lägg till en direktlänk till exakt produkt eller erbjudande.'};
  if(!chk)return {err:'Ange datum när pris, villkor och produktlänk senast kontrollerades.'};
  if(chk>todayISO())return {err:'Kontrolldatumet kan inte ligga i framtiden.'};
  return {p:{store,logo,color:v('f_color'),category:v('f_cat'),name,price,old_price:old,image_url:image,unit_text:v('f_utext').trim()||null,unit_price:num(v('f_uprice')),membership:v('f_mem').trim()||null,affiliate_url:aff||null,shop_url:url||null,valid_to:vt,checked_on:chk,conditions:cond||null,valid_until:until,compare_group:v('f_group').trim()||null}};
}
async function save(){
  const r=collect();if(r.err)return setMsg(r.err);
  setMsg('Sparar…');
  let res;
  if(editId){res=await sb.from('deals').update(r.p).eq('id',editId).select()}
  else{const next=DATA.reduce((a,d)=>Math.max(a,d.id),0)+1;res=await sb.from('deals').insert({id:next,...r.p}).select()}
  if(res.error||!res.data||!res.data.length)return setMsg('Kunde inte spara. Är du inloggad med ett administratörskonto?');
  toast(editId?'Ändringarna har sparats':'Erbjudande tillagt');
  editId=null;await loadErbjudanden();adminView();scrollTo(0,0);
}
async function del(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;
  if(!confirm('Ta bort "'+d.name+'" från '+d.store+'? This also removes it från users\' saved lists.'))return;
  const res=await sb.from('deals').delete().eq('id',id).select();
  if(res.error||!res.data||!res.data.length)return toast('Kunde inte ta bort');
  toast('Erbjudandet har tagits bort');await loadErbjudanden();renderList();
}

function parseCSV(text){
 const first=(text.split(/\r?\n/,1)[0]||'');const delimiter=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'&&quoted&&text[i+1]==='"'){field+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===delimiter&&!quoted){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=ch}
 row.push(field);if(row.some(x=>x.trim()))rows.push(row);
 if(rows.length<2)return [];
 const headers=rows.shift().map((h,i)=>h.trim()||('column_'+i));
 return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])));
}
function parseXML(text){
 const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('XML-filen kunde inte läsas.');
 let nodes=[...doc.querySelectorAll('item, product, entry, offer, article')];
 nodes=nodes.filter(n=>!nodes.some(p=>p!==n&&p.contains(n)));
 if(!nodes.length)nodes=[...doc.documentElement.children];
 return nodes.map(n=>{const o={};for(const a of [...n.attributes])o[a.name]=a.value;for(const x of [...n.children])o[x.localName]=x.textContent.trim();return o});
}
function fieldOf(o,aliases){
 const entries=Object.entries(o);for(const a of aliases){const found=entries.find(([k])=>k.toLowerCase().replace(/[^a-z0-9]/g,'')===a);if(found&&found[1])return String(found[1]).trim()}
 return '';
}
function validISODate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return false;
  const [y,m,d]=value.split('-').map(Number),date=new Date(Date.UTC(y,m-1,d));
  return date.getUTCFullYear()===y&&date.getUTCMonth()===m-1&&date.getUTCDate()===d;
}
function parseFeedDate(value){
  const x=String(value||'').trim();let m,iso='';
  if((m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[Tt ].*)?$/)))iso=m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  else if((m=x.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/)))iso=m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  else if((m=x.match(/^(\d{4})(\d{2})(\d{2})$/)))iso=m[1]+'-'+m[2]+'-'+m[3];
  return validISODate(iso)?iso:'';
}
function normalizeImport(o,i){
 const store=fieldOf(o,['store','merchant','advertiser','brand','retailer'])||'Okänd butik';
 const name=fieldOf(o,['name','title','productname','producttitle','description','product']);
 const priceRaw=fieldOf(o,['price','saleprice','currentprice','finalprice','discountprice']);
 const oldRaw=fieldOf(o,['oldprice','originalprice','regularprice','rrp','listprice']);
 const image=fieldOf(o,['imageurl','image','imagelink','picture','pictureurl']);
 const tracking=fieldOf(o,['affiliateurl','trackingurl','deeplink','trackinglink']);
 const productUrl=fieldOf(o,['producturl','productlink','url','link']);
 const expiry=fieldOf(o,['validto','validuntil','enddate','expirydate','expirationdate','offerenddate','campaignenddate','validthrough']);
 const conditions=fieldOf(o,['conditions','terms','specialconditions']);
 const category=fieldOf(o,['category','productcategory','categoryname'])||'Övrigt';
 const price=parseFeedNumber(priceRaw),old=parseFeedNumber(oldRaw),valid_to=parseFeedDate(expiry);
 const safeUrl=value=>httpsUrl(value)||'';
 return {key:i,store,name,price,old_price:old,image_url:safeUrl(image),affiliate_url:safeUrl(tracking),shop_url:safeUrl(productUrl),valid_to,valid_until:valid_to?(+valid_to.slice(8,10))+'/'+(+valid_to.slice(5,7)):'',conditions,category,duplicate:!!DATA.find(d=>String(d.store).toLowerCase()===store.toLowerCase()&&String(d.name).toLowerCase()===name.toLowerCase()),selected:false,image_loaded:false,image_failed:false,raw:o};
}
function parseFeedNumber(s){if(!s)return null;let x=String(s).replace(/\s/g,'').replace(/[A-Za-z€$£]/g,'');if(x.includes(',')&&x.includes('.'))x=x.lastIndexOf(',')>x.lastIndexOf('.')?x.replace(/\./g,'').replace(',','.'):x.replace(/,/g,'');else x=x.replace(',','.');const n=Number(x);return Number.isFinite(n)&&n>0?n:null}
function importView(){
 $('#app').innerHTML=tabsHTML()+`<div class="panel"><b>Förhandsgranskning av produktflöde</b><p class="import-help">Välj ett produktflöde i CSV- eller XML-format. Filen läses lokalt. Ingenting sparas förrän du väljer produkter och bekräftar.</p><label class="filepick">Välj produktflödesfil<input id="feedfile" type="file" accept=".csv,.xml,text/csv,application/xml,text/xml"></label><div class="msg" id="msg" role="alert"></div></div><div id="importpreview"></div>`;
}
function importIssue(r){
 if(!r.store||r.store==='Okänd butik')return 'Butik saknas';
 if(!r.name)return 'Produktnamn saknas';
 if(!r.price||!r.old_price||r.old_price<=r.price)return 'Ogiltigt kampanjpris eller jämförelsepris';
 if(!r.image_url)return 'Produktbild med HTTPS-länk saknas';
 if(r.image_failed)return 'Produktbilden kunde inte laddas';
 if(!r.image_loaded)return 'Kontrollerar produktbild…';
 if(!r.valid_to)return 'Riktigt slutdatum saknas';
 if(r.valid_to<todayISO())return 'Erbjudandet har redan gått ut';
 if(!r.affiliate_url&&!r.shop_url)return 'Produktlänk eller affiliatelänk saknas';
 if(r.duplicate)return 'Möjlig dubblett';
 return '';
}
function updateImportSummary(){
 const box=$('#importpreview');if(!box)return;
 const eligible=IMPORT_ROWS.filter(r=>!importIssue(r)).length;
 const selected=IMPORT_ROWS.filter(r=>r.selected&&!importIssue(r)).length;
 const summary=box.querySelector('[data-import-summary]');
 if(summary)summary.textContent=eligible+' godkända av '+IMPORT_ROWS.length+' produkter';
 const count=box.querySelector('[data-import-selected-count]');
 if(count)count.textContent=selected+' valda';
 const btn=box.querySelector('[data-publish-selected]');
 if(btn)btn.disabled=!(selected&&Object.values(IMPORT_CHECKS).every(Boolean)&&validISODate(IMPORT_CHECKED_ON)&&IMPORT_CHECKED_ON<=todayISO());
}
function refreshImportRow(r){
 const box=$('#importpreview');if(!box)return;
 const row=box.querySelector('[data-import-row="'+r.key+'"]');if(!row)return;
 const status=row.querySelector('[data-image-status]');
 if(status){status.textContent=r.image_failed?'Bilden kunde inte laddas':r.image_loaded?'Bilden laddades – kontrollera att det är rätt produkt':'Kontrollerar bild…';status.classList.toggle('bad',!!r.image_failed)}
 const issue=importIssue(r),issueNode=row.querySelector('.import-issue');
 if(issueNode){issueNode.textContent=issue||'Klar att läggas till';issueNode.classList.toggle('bad',!!issue)}
 const checkbox=row.querySelector('[data-import-select]');
 if(checkbox){checkbox.disabled=!!issue;checkbox.checked=!!r.selected&&!issue}
 updateImportSummary();
}
function renderImport(){
 const box=$('#importpreview');if(!box)return;
 const eligible=IMPORT_ROWS.filter(r=>!importIssue(r)).length;
 const selected=IMPORT_ROWS.filter(r=>r.selected&&!importIssue(r)).length;
 box.innerHTML=IMPORT_ROWS.length?`<h2>Förhandsgranska produkter (${IMPORT_ROWS.length})</h2><p class="import-help" data-import-summary>${eligible} godkända av ${IMPORT_ROWS.length} produkter. Rader utan produktbild, giltigt slutdatum, korrekta priser eller direktlänk blockeras.</p><div class="two" style="margin:12px 0"><button class="btn ghost sm" type="button" data-selectall>Markera alla godkända</button><button class="btn ghost sm" type="button" data-clearselect>Rensa markering</button></div>`+IMPORT_ROWS.map(r=>{const issue=importIssue(r);return `<div class="import-row" data-import-row="${r.key}"><input type="checkbox" data-import-select="${r.key}" ${r.selected&&!issue?'checked':''} ${issue?'disabled':''} aria-label="Select product">${r.image_url?`<img src="${esc(r.image_url)}" data-import-image="${r.key}" alt="Produktbild">`:`<div class="image-placeholder">Bild saknas</div>`}<div class="t"><b>${esc(r.name||'Namnlös produkt')}</b><small>${esc(r.store)} · ${r.price?kr(r.price):'Pris saknas'} ${r.old_price?'(tidigare '+kr(r.old_price)+')':''}</small><small>Giltig t.o.m. ${esc(r.valid_until||'saknar slutdatum')}</small><small class="image-status ${r.image_failed?'bad':''}" data-image-status>${r.image_failed?'Bilden kunde inte laddas':r.image_loaded?'Bilden laddades – kontrollera att det är rätt produkt':'Kontrollerar bild…'}</small><small class="import-issue ${issue?'bad':''}">${esc(issue||'Klar att läggas till')}</small><small>${r.affiliate_url?'Affiliatelänk finns':'Ingen affiliatelänk'} · ${r.shop_url?'Produktlänk finns':'Ingen produktlänk'}</small>${r.conditions?`<small>Villkor: ${esc(r.conditions)}</small>`:''}</div></div>`}).join('')+`<div class="panel"><b data-import-selected-count>${selected} valda</b><label for="import_checked_on">Datum då du kontrollerade priser, bild och villkor (obligatoriskt)</label><input id="import_checked_on" type="date" max="${todayISO()}" value="${esc(IMPORT_CHECKED_ON)}"><p class="import-help">Välj det datum då du faktiskt kontrollerade de markerade produkterna. Dagens datum fylls inte i automatiskt.</p>${priceChecksHTML('i')}<p class="import-help">Alla tre kontroller måste vara markerade för samtliga valda produkter innan publicering aktiveras.</p><button class="btn" type="button" data-publish-selected ${selected&&Object.values(IMPORT_CHECKS).every(Boolean)&&validISODate(IMPORT_CHECKED_ON)&&IMPORT_CHECKED_ON<=todayISO()?'':'disabled'}>Publicera valda produkter</button><div class="msg" id="publishmsg" role="status"></div></div>`:`<p class="import-help">Inga produkter har lästs in ännu.</p>`;
 updateImportSummary();
}
async function publishSelected(){
 if(!validISODate(IMPORT_CHECKED_ON)||IMPORT_CHECKED_ON>todayISO())return toast('Ange ett giltigt kontrolldatum som inte ligger i framtiden');
 if(!Object.values(IMPORT_CHECKS).every(Boolean))return toast('Bekräfta alla tre kontrollerna först');
 const rows=IMPORT_ROWS.filter(r=>r.selected&&!importIssue(r));
 if(!rows.length)return toast('Markera godkända produkter först');
 const keys=new Set();
 for(const r of rows){const k=(r.store+'|'+r.name).toLowerCase();if(keys.has(k)||DATA.some(d=>(String(d.store)+'|'+String(d.name)).toLowerCase()===k))return toast('Dubblett upptäckt. Läs in produktflödet på nytt.');keys.add(k)}
 const list=rows.map(r=>r.store+': '+r.name+' — '+kr(r.price)+' — giltig t.o.m. '+r.valid_until).join('\\n');
 if(!confirm('Publicera '+rows.length+' valda produkter?\\n\\n'+list+'\\n\\nKontrollera att varje bild visar rätt produkt. Fortsätt?'))return;
 const firstId=DATA.reduce((m,d)=>Math.max(m,Number(d.id)||0),0)+1;
 const payload=rows.map((r,i)=>{const parts=r.store.trim().split(/\s+/);const logo=parts.length>1?parts.map(x=>x[0]).join('').slice(0,3).toUpperCase():r.store.slice(0,3).toUpperCase();return {id:firstId+i,store:r.store,logo,color:'#10b981',category:r.category||'Övrigt',name:r.name,price:r.price,old_price:r.old_price,image_url:r.image_url,affiliate_url:r.affiliate_url||null,shop_url:r.shop_url||null,valid_until:r.valid_until,valid_to:r.valid_to,checked_on:IMPORT_CHECKED_ON,conditions:r.conditions||null};});
 const btn=$('[data-publish-selected]');if(btn){btn.disabled=true;btn.textContent='Sparar…'}
 const result=await sb.from('deals').insert(payload).select();
 if(result.error||!result.data||result.data.length!==payload.length){const m=$('#publishmsg');if(m)m.textContent='Det gick inte att bekräfta sparandet. Kontrollera erbjudandelistan innan du försöker igen.';if(btn){btn.disabled=false;btn.textContent='Publicera markerade produkter'}return}
 IMPORT_ROWS=IMPORT_ROWS.filter(r=>!r.selected);IMPORT_CHECKED_ON='';IMPORT_CHECKS={campaign:false,reference:false,terms:false};await loadErbjudanden();renderImport();toast(rows.length+' produkt(er) publicerade');
}
async function readFeed(file){
 if(!file)return;setMsg('Läser filen…');
 try{const txt=await file.text();const objects=/\.xml$/i.test(file.name)||txt.trim().startsWith('<')?parseXML(txt):parseCSV(txt);IMPORT_CHECKED_ON='';IMPORT_CHECKS={campaign:false,reference:false,terms:false};IMPORT_ROWS=objects.map(normalizeImport);const seen=new Set();IMPORT_ROWS.forEach(r=>{const k=(r.store+'|'+r.name).toLowerCase();if(seen.has(k))r.duplicate=true;seen.add(k)});renderImport();setMsg(IMPORT_ROWS.length?'Produktflödet har lästs in. Granska och markera produkter nedan.':'Inga produkter hittades i filen.');}
 catch(e){IMPORT_ROWS=[];renderImport();setMsg(e.message||'Filen kunde inte läsas.')}
}

document.addEventListener('change',e=>{if(e.target.id==='feedfile')readFeed(e.target.files&&e.target.files[0]);if(e.target.id==='import_checked_on'){IMPORT_CHECKED_ON=e.target.value;updateImportSummary()}if(e.target.matches('[data-import-select]')){const r=IMPORT_ROWS.find(x=>x.key===Number(e.target.dataset.importSelect));if(r){r.selected=e.target.checked;IMPORT_CHECKS={campaign:false,reference:false,terms:false};renderImport()}}if(e.target.matches('[data-import-check]')){IMPORT_CHECKS[e.target.dataset.importCheck]=e.target.checked;renderImport()}});
document.addEventListener('load',e=>{if(!e.target.matches('[data-import-image]'))return;const r=IMPORT_ROWS.find(x=>x.key===Number(e.target.dataset.importImage));if(r){r.image_loaded=true;r.image_failed=false;refreshImportRow(r)}},true);
document.addEventListener('error',e=>{if(!e.target.matches('[data-import-image]'))return;const r=IMPORT_ROWS.find(x=>x.key===Number(e.target.dataset.importImage));if(r){r.image_loaded=false;r.image_failed=true;r.selected=false;refreshImportRow(r)}},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.login!==undefined)doLogin();
  else if(d.save!==undefined)save();
  else if(d.cancel!==undefined){editId=null;adminView()}
  else if(d.edit){editId=+d.edit;adminView();scrollTo(0,0)}
  else if(d.del){del(+d.del)}
  else if(d.today!==undefined){$('#f_chk').value=todayISO()}
  else if(d.view){view=d.view;editId=null;adminView()}
  else if(d.csave!==undefined)saveCode()
  else if(d.cdel){delCode(+d.cdel)}
  else if(d.selectall!==undefined){IMPORT_ROWS.forEach(r=>r.selected=!importIssue(r));IMPORT_CHECKS={campaign:false,reference:false,terms:false};renderImport()}
  else if(d.clearselect!==undefined){IMPORT_ROWS.forEach(r=>r.selected=false);IMPORT_CHECKS={campaign:false,reference:false,terms:false};renderImport()}
  else if(d.publishSelected!==undefined){publishSelected()}
  else if(b.id==='out'){sb.auth.signOut()}
});
document.addEventListener('input',e=>{if(e.target.id==='flt'){filter=e.target.value;renderList()}if(e.target.id==='f_img')updateManualImagePreview()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em'))doLogin()});
(async()=>{
  if(!sb){loginView('Kunde inte starta. Ladda om sidan.');return}
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;
  await afterAuth();
  sb.auth.onAuthStateChange((ev,s)=>{const u=s?s.user:null;if((u&&u.id)!==(user&&user.id)){user=u;setTimeout(afterAuth,0)}});
})();
</script>
